name: almoslim
description: A comprehensive Islamic app with Quran, Hadith, Adhkar, Prayer Times, and Live Radio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_messaging: ^14.7.15

  # Audio
  just_audio: ^0.9.37
  audio_service: ^0.18.12
  just_audio_background: ^0.0.1-beta.11

  # Networking
  http: ^1.2.1
  dio: ^5.4.1

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Date & Time
  intl: ^0.19.0
  hijri: ^3.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  flutter_html: ^3.0.0-beta.2
  lottie: ^3.1.0

  # Notifications
  flutter_local_notifications: ^17.1.0

  # Utilities
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/data/
